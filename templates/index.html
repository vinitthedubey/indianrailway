<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Railways Chatbot</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="chat-container">
        <div id="chatbox">
            <div id="messages"></div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type your message here...">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
        <div class="button-container">
            <button class="chat-btn" onclick="sendOption('Book Ticket')">Book Ticket</button>
            <button class="chat-btn" onclick="sendOption('Cancel Ticket')">Cancel Ticket</button>
            <button class="chat-btn" onclick="sendOption('Train Status')">Train Status</button>
            <button class="chat-btn" onclick="sendOption('Download Ticket')">Download Ticket</button>
            <button class="chat-btn" onclick="sendOption('Exit')">Exit</button>
        </div>
        <div class="language-container">
            <label for="languageSelect">Indian Railways by vinit</label>
            <select id="languageSelect">
                <option value="English">CHATBOT</option>
            </select>
        </div>
    </div>
    <script src="static/script.js"></script>
</body>
</html>
