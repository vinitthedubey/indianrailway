<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Railways</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: black; /* Set background color to black */
        }

        .container {
            text-align: center;
            margin-top: 2cm; /* 2cm margin between text and button */
        }

        .railways-text {
            color: #008000; /* Green Color */
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .microphone-button {
            background: url('https://cdn.pixabay.com/animation/2023/06/13/15/12/15-12-34-448_512.gif') no-repeat center; /* Set button background as the provided image */
            background-size: contain; /* Ensure the image covers the button */
            width: 3cm; /* 3cm width */
            height: 3cm; /* 3cm height */
            border: none;
            cursor: pointer;
        }
        
        .image-container img {
            width: 300px; /* Set the image width */
            height: auto; /* Maintain the aspect ratio */
            display: block; /* Center the image */
            margin: 20px auto; /* Add margin above and below */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="railways-text">Indian Railways</div>
    <form method="POST">
        <button id="microphone-button" class="microphone-button" type="submit" name="microphone-button"></button>
    </form>
</div>

<div class="image-container">
    <img src="https://cdn.pixabay.com/animation/2023/03/19/07/28/07-28-58-728_512.gif" alt="Chatbot Image">
</div>


<script>
    let hasClicked = false; // Flag to track if the button has been clicked

    document.getElementById('microphone-button').addEventListener('click', function() {
        if (hasClicked) {
            alert('Button pressed twice Kindly Refresh!');
            hasClicked = true; // Set the flag to true to indicate the button has been clicked
            location.reload(); // Reload the page
            this.disabled = true; // Disable Button
            event.preventDefault(); // Prevent default form submission behavior
        }
        hasClicked = true;
    });
</script>

</body>
</html>
